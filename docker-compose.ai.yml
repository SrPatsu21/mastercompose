services:
  ollama:
    image: ollama/ollama:latest
    container_name: mastercompose-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ./aidata/ollama:/root/.ollama

    environment:
      - OLLAMA_KEEP_ALIVE=24h

    networks:
      - ai

    # for NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mastercompose-open-webui
    restart: unless-stopped

    depends_on:
      - ollama

    ports:
      - "45050:8080"

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - ./aidata/open-webui:/app/backend/data

    networks:
      - ai

networks:
  ai:
    driver: bridge

