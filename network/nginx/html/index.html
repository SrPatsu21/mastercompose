<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="/favicon.ico" sizes="any">

    <link
        rel="icon"
        href="/favicon-16x16.png"
        type="image/png"
        sizes="16x16"
    >

    <link
        rel="icon"
        href="/favicon-32x32.png"
        type="image/png"
        sizes="32x32"
    >

    <link
        rel="apple-touch-icon"
        href="/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="/site.webmanifest"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Master Compose</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0f1115;
            color: #f5f5f5;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: min(900px, 92%);
            padding: 40px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 32px;
        }

        .services {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 16px;
        }

        .service {
            display: block;

            padding: 24px;

            background: #181b21;
            border: 1px solid #292d36;
            border-radius: 12px;

            color: inherit;
            text-decoration: none;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease;
        }

        .service:hover {
            transform: translateY(-2px);
            border-color: #555;
        }

        .service-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .service-url {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .footer {
            margin-top: 32px;
            color: #6b7280;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

<main>

    <h1>Master Compose</h1>

    <div class="subtitle">
        Serviços disponíveis
    </div>

    <section class="services">

        <a
            class="service"
            href="/forgejo/"
        >
            <div class="service-name">
                Forgejo
            </div>

            <div class="service-url">
                host/forgejo/
            </div>
        </a>

    </section>

    <div class="footer">
        Master Compose
    </div>

</main>

</body>
</html>
