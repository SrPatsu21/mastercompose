<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="data:,">
    <title>Painel de Serviços - Servidor do Paulo Sérgio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 'gray-750': '#2a2f38' } } }
        };
    </script>

    <style>
        .theme-transition * {
            transition: color 0.3s, background 0.3s, border-color 0.3s;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-full font-sans theme-transition">

    <div class="min-h-screen flex flex-col items-center justify-start px-4 pt-10">

        <div class="absolute top-5 right-5">
            <button id="themeToggle"
                class="p-2 rounded-lg bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 shadow">
                🌙
            </button>
        </div>

        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 dark:text-white drop-shadow-lg">
                🖥️ Painel de Serviços
            </h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">
                Escolha um serviço para acessar
            </p>
        </header>

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-5xl">

            <a href="https://git.paulosergio.pierdona.nom.br/" target="_blank"
                class="relative p-6 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 transition shadow-lg hover:scale-[1.02] active:scale-[0.98] flex flex-col items-start gap-3">
                
                <div id="status-forgejo" class="w-3 h-3 rounded-full bg-red-500 absolute top-3 right-3"></div>

                <img src="https://forgejo.org/favicon.svg" class="w-12 h-12 opacity-90">
                <h2 class="text-xl font-bold text-blue-600 dark:text-blue-400">Forgejo</h2>
                <p class="text-gray-700 dark:text-gray-300 text-sm">
                    Repositórios Git, CI/CD e projetos.
                </p>
            </a>

            <a href="https://backrest.paulosergio.pierdona.nom.br/" target="_blank"
                class="relative p-6 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 transition shadow-lg hover:scale-[1.02] active:scale-[0.98] flex flex-col items-start gap-3">

                <div id="status-backrest" class="w-3 h-3 rounded-full bg-red-500 absolute top-3 right-3"></div>

                <img src="https://raw.githubusercontent.com/garethgeorge/backrest/84cb2a2193f8228461801a35abf5d8e252ecfd37/webui/assets/favicon.svg"
                     class="w-12 h-12 opacity-90">
                <h2 class="text-xl font-bold text-green-600 dark:text-green-400">Backrest</h2>
                <p class="text-gray-700 dark:text-gray-300 text-sm">
                    Sistema de backups e snapshots.
                </p>
            </a>

            <a href="https://git.paulosergio.pierdona.nom.br/v2/" target="_blank"
                class="relative p-6 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 transition shadow-lg hover:scale-[1.02] active:scale-[0.98] flex flex-col items-start gap-3">
                
                <div id="status-registry" class="w-3 h-3 rounded-full bg-red-500 absolute top-3 right-3"></div>

                <img src="https://www.docker.com/wp-content/uploads/2022/03/Moby-logo.png"
                     class="w-12 h-12 opacity-90">
                <h2 class="text-xl font-bold text-yellow-600 dark:text-yellow-400">Docker Registry</h2>
                <p class="text-gray-700 dark:text-gray-300 text-sm">
                    Registro privado de imagens Docker.
                </p>
            </a>

            <div class="p-6 rounded-xl bg-gray-200 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 opacity-40 flex flex-col gap-3 cursor-not-allowed">
                <div class="w-12 h-12 bg-gray-400 dark:bg-gray-700 rounded-full"></div>
                <h2 class="text-xl font-bold text-gray-500">Em breve</h2>
                <p class="text-gray-500 text-sm">Novo serviço será adicionado.</p>
            </div>

        </div>

        <footer class="mt-10 mb-5 text-gray-600 dark:text-gray-500 text-sm">
            © <span id="year"></span> - Servidor do Paulo Sérgio · Nginx
        </footer>

    </div>

    <script>
        const btn = document.getElementById("themeToggle");
        const html = document.documentElement;

        btn.addEventListener("click", () => {
            html.classList.toggle("dark");
            localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
            btn.textContent = html.classList.contains("dark") ? "🌞" : "🌙";
        });

        if (localStorage.getItem("theme") === "dark") {
            html.classList.add("dark");
            btn.textContent = "🌞";
        }

        document.getElementById("year").textContent = new Date().getFullYear();

        async function testarServico(url, elementoIndicador) {
            elementoIndicador.classList.remove("bg-red-500", "bg-green-500");
            elementoIndicador.classList.add("bg-yellow-400");
            try {
                await fetch(url, { method: "HEAD", mode: "no-cors" });
                elementoIndicador.classList.remove("bg-yellow-400");
                elementoIndicador.classList.add("bg-green-500");
            } catch (e) {
                elementoIndicador.classList.remove("bg-yellow-400");
                elementoIndicador.classList.add("bg-red-500");
            }
        }

        const servicos = [
            { url: "https://git.paulosergio.pierdona.nom.br/", id: "status-forgejo" },
            { url: "https://backrest.paulosergio.pierdona.nom.br/", id: "status-backrest" },
            { url: "https://git.paulosergio.pierdona.nom.br/v2/", id: "status-registry" }
        ];

        servicos.forEach(s => {
            const el = document.getElementById(s.id);
            if (el) testarServico(s.url, el);
        });
    </script>

</body>
</html>
