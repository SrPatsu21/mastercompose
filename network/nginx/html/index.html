<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Master Compose</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f1115;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: min(900px, 92%);
            padding: 40px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 32px;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .service {
            position: relative;
            display: block;
            padding: 24px;
            background: #181b21;
            border: 1px solid #292d36;
            border-radius: 12px;
            color: inherit;
            text-decoration: none;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .service:hover {
            transform: translateY(-2px);
            border-color: #555;
        }

        .service-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            padding-right: 28px;
        }

        .service-url {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .status-dot {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6b7280; /* padrão */
            box-shadow: 0 0 0 2px rgba(255,255,255,0.06);
        }

        .status-loading {
            background: #facc15; /* amarelo */
            animation: pulse 1s infinite;
        }

        .status-up {
            background: #22c55e; /* verde */
        }

        .status-down {
            background: #ef4444; /* vermelho */
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .footer {
            margin-top: 32px;
            color: #6b7280;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
<main>
    <h1>Master Compose</h1>

    <div class="subtitle">
        Serviços disponíveis
    </div>

    <section class="services">

        <a class="service" href="/forgejo/">
            <span class="status-dot" aria-hidden="true"></span>
            <div class="service-name">Forgejo</div>
            <div class="service-url">host/forgejo/</div>
        </a>

        <a class="service" href="/jellyfin/">
            <span class="status-dot" aria-hidden="true"></span>
            <div class="service-name">Jellyfin</div>
            <div class="service-url">host/jellyfin/</div>
        </a>

    </section>

    <div class="footer">
        Master Compose
    </div>
</main>

<script>
    async function testService(card) {
        const dot = card.querySelector('.status-dot');
        const url = card.getAttribute('href');

        dot.classList.remove('status-up', 'status-down');
        dot.classList.add('status-loading');

        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);

            const resposta = await fetch(url, {
                method: 'GET',
                cache: 'no-store',
                signal: controller.signal
            });

            clearTimeout(timeout);

            if (resposta.ok) {
                dot.classList.remove('status-loading');
                dot.classList.add('status-up');
            } else {
                dot.classList.remove('status-loading');
                dot.classList.add('status-down');
            }
        } catch (erro) {
            dot.classList.remove('status-loading');
            dot.classList.add('status-down');
        }
    }

    document.querySelectorAll('.service').forEach(card => {
        testService(card);
    });
</script>
</body>
</html>
