# === Modern OpenSSL 3 configuration ===
ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 ciphersuites
ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

# TLS 1.2 (if negotiated)
ssl_conf_command CipherString DEFAULT@SECLEVEL=2;

# Preference and curves
ssl_conf_command Options ServerPreference,PrioritizeChaCha;
ssl_conf_command Curves X25519:P-256;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP stapling (optional)
ssl_stapling on;
ssl_stapling_verify on;
