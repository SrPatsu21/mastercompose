upstream portus_upstream {
    zone portus_upstream 64k;
    server portus:33002 resolve;
    keepalive 16;
}

server {
    listen 3002;
    server_name portus.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portus.com;

    ssl_certificate     /etc/letsencrypt/live/portus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portus.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://portus_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
}
