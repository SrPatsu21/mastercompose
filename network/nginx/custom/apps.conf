# =============================================
# Upstreams
# =============================================
upstream gitlab_upstream { server gitlab:80; }
upstream portus_upstream { server portus:3000; }
upstream backrest_upstream { server backrest:8080; }

# =============================================
# Map for WebSockets
# =============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================
# HTTP -> HTTPS redirect
# =============================================
server {
    listen 80;
    server_name 10.147.19.101;
    return 301 https://$host$request_uri;
}

# =============================================
# HTTPS Server for all apps (path-based)
# =============================================
server {
    listen 443 ssl http2;
    server_name 10.147.19.101;

    ssl_certificate     /etc/letsencrypt/live/dummy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dummy/privkey.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self';" always;

    # =============================================
    # GitLab
    # =============================================
    location /gitlab.mc.localhost/ {
        proxy_pass http://gitlab_upstream/;
        proxy_set_header Host gitlab.mc.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # =============================================
    # Backrest
    # =============================================
    location /backrest.mc.localhost/ {
        proxy_pass http://backrest_upstream/;
        proxy_set_header Host backrest.mc.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
}