# /etc/nginx/conf.d/backrest.conf
upstream backrest_upstream {
    zone backrest_upstream 64k;
    server backrest:33000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name backrest.example.com;

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name backrest.example.com;

    # Certificates (replace domain as needed)
    ssl_certificate     /etc/letsencrypt/live/backrest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backrest.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Upstream resolution at runtime — avoids start failures
        set $backend "backrest_upstream";

        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry if upstream is down
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
}
