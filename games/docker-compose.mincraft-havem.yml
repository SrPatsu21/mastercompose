services:
  minecraft-haven:
    tty: true
    stdin_open: true
    image: itzg/minecraft-server
    container_name: mastercompose-minecraft-haven
    restart: unless-stopped
    env_file:
      - .env
    volumes:
        - ./minecraft-haven:/data
    ports:
      - "${HAVEN_MINECRAFT_PORT}:25565"
      - "${HAVEN_RCON_PORT}:25575"
    environment:
      - EULA=TRUE
      - AUTO_UPDATE=false
      - VERSION=26.3
      - INIT_MEMORY=2G
      - MAX_MEMORY=4G
      - ONLINE_MODE=FALSE
      - DIFFICULTY=hard
      - MAX_PLAYERS=10
      - VIEW_DISTANCE=24
      - MODE=survival
      - SERVER_NAME=Haven
      - ENABLE_WHITELIST=FALSE
      - ALLOW_FLIGHT=TRUE
      - ENABLE_RCON=TRUE
      - RCON_PASSWORD=${HAVEN_RCON_PASSWORD}
      - RCON_PORT=25575
