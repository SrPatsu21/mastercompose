services:
  minecraft-haven:
    tty: true
    stdin_open: true
    image: itzg/minecraft-server:1.21.6
    container_name: mastercompose-minecraft-haven
    volumes:
      - ./apps/minecraft-haven/world/:/data/world
      - ./apps/minecraft-haven/whitelist.json:/data/whitelist.json
    ports:
      - "${MINECRAFT_HAVEN_PORT}:25565"
      - "${RCON_PORT}:25575"
    environment:
      - EULA=TRUE
      - AUTO_UPDATE=false
      - VERSION=1.21.6
      - INIT_MEMORY=2G
      - MAX_MEMORY=4G
      - ONLINE_MODE=FALSE
      - DIFFICULTY=hard
      - MAX_PLAYERS=10
      - VIEW_DISTANCE=16
      - MODE=survival
      - SERVER_NAME=Haven
      - ENABLE_WHITELIST=FALSE
      - ALLOW_FLIGHT=TRUE
      - ENABLE_RCON=TRUE
      - RCON_PASSWORD=${RCON_PASSWORD}
      - RCON_PORT={RCON_PORT}

networks:
    internal:
        name: mastercompose_internal
        external: true