services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    restart: unless-stopped
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.com'
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - ./gitlab/data:/var/opt/gitlab
    networks:
      - internal
    # No ports exposed!

  # portus:
  #   image: opensuse/portus:head
  #   restart: unless-stopped
  #   environment:
  #     PORTUS_MACHINE_FQDN_VALUE: portus.local
  #   volumes:
  #     - ./portus:/data
  #   networks:
  #     - internal

  # backrest:
  #   image: ghcr.io/pgbackrest/backrest:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./backups:/backups
  #     - ./gitlab/data:/source/gitlab:ro
  #     - ./portus:/source/portus:ro
  #   networks:
  #     - internal

networks:
  internal:
    external: true
