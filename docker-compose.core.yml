services:
    gitlab:
        image: gitlab/gitlab-ce:18.4.3-ce.0
        container_name: mastercompose-gitlab
        restart: unless-stopped
        env_file:
            - .env
        environment:
            GITLAB_OMNIBUS_CONFIG: |
                external_url 'http://${ZT_ADDRS}/${GITLAB_SERVER_NAME}'
                gitlab_rails['gitlab_relative_url_root'] = '/${GITLAB_SERVER_NAME}'

                gitlab_rails['gitlab_shell_ssh_port'] = 22
                gitlab_rails['gitlab_rails_allowed_hosts'] = ['${ZT_ADDRS}']

                # Nginx
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                nginx['worker_processes'] = 1
                nginx['worker_connections'] = 512

                # Timezone
                gitlab_rails['time_zone'] = 'UTC'

                # Web server: Puma
                puma['worker_processes'] = 1
                puma['threads_min'] = 1
                puma['threads_max'] = 2

                # Sidekiq: background job processor
                sidekiq['max_concurrency'] = 2


                # Disable nonessential components
                prometheus_monitoring['enable'] = false
                alertmanager['enable'] = false
                gitlab_exporter['enable'] = false
                mattermost_external_url nil
                registry_external_url nil
                pages_external_url nil

                # Reduce Postgres memory
                postgresql['shared_buffers'] = '128MB'
                postgresql['max_worker_processes'] = 2

                # Optional: reduce Redis memory usage
                redis['maxmemory_policy'] = 'allkeys-lru'
                redis['maxmemory'] = '128mb'

                # Turn off CI/CD and other subsystems
                gitlab_rails['gitlab_default_projects_features_builds'] = false
                gitlab_rails['gitlab_default_projects_features_container_registry'] = false
                gitlab_rails['gitlab_default_projects_features_wiki'] = false
                gitlab_rails['gitlab_default_projects_features_issues'] = false
                gitlab_rails['gitlab_default_projects_features_merge_requests'] = false

                # Reduce logging verbosity
                logging['logrotate_frequency'] = "daily"
                logging['svlogd_size'] = 1000000
                logging['svlogd_num'] = 5
        ports:
            - "8022:22"  # optional SSH access if needed
        volumes:
            - ./core/gitlab/config:/etc/gitlab
            - ./core/gitlab/logs:/var/log/gitlab
            - ./core/gitlab/data:/var/opt/gitlab
        networks:
            - internal
        # deploy:
        #     resources:
        #         limits:
        #         memory: 1500M

    # Optional backup service
    backrest:
        image: garethgeorge/backrest:v1.10.1-scratch
        container_name: mastercompose-backrest
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - ./core/backrest/config:/root/.config/backrest # persistent config + users
            - ./core/gitlab/data:/source/gitlab:ro # data to back up
            - ./core/backups:/backups # optional local repo
        networks:
            - internal

networks:
    internal:
        name: mastercompose_internal
        external: true