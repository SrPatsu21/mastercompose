services:
  nginx-proxy:
    image: nginx:mainline-alpine-perl
    container_name: mastercompose-nginx-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
    volumes:
      - ${NGINX_DATA}:/data
      - ${NGINX_LETSENCRYPT}:/etc/letsencrypt
      - ${NGINX_CUSTOM}:/etc/nginx/templates
      - ${NGINX_HTML}:/etc/nginx/html
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"

  #optinal
  zerotier:
    image: zerotier/zerotier:1.14.2
    container_name: mastercompose-zerotier
    restart: unless-stopped
    cap_add:
        - NET_ADMIN
    devices:
        - /dev/net/tun
    environment:
        ZT_NETWORK: ${ZT_NETWORK}
    volumes:
        - ${ZEROTIER_DATA}:/var/lib/zerotier-one
    network_mode: "host"

  #optinal
  cloudflare-ddns:
    image: oznu/cloudflare-ddns
    container_name: mastercompose-cloudflare-ddns
    restart: always
    env_file:
      - .env
    environment:
      - API_KEY=${CF_API_KEY}
      - ZONE=${CF_ZONE}
      - SUBDOMAIN=${CF_SUBDOMAIN}

networks:
  internal:
    name: mastercompose_internal
    driver: bridge
