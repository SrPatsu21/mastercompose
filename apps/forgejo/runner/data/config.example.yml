log:
  level: info
  job_level: info

runner:
  file: .runner
  capacity: 1
  envs:
    DOCKER_HOST: tcp://dind.internal:2375
  env_file: .env
  timeout: 3h
  shutdown_timeout: 3h
  insecure: true
  fetch_timeout: 30s
  fetch_interval: 2s
  report_interval: 1s
  labels:
    - "basic-ci-img:docker://10.147.18.1/srpatsu21/basic-ci-img:ubuntu-24.04"

cache:
  enabled: true

  port: 0

  dir: ""

  external_server: ""

  secret: ""

  secret_url: ""

  host: ""

  proxy_port: 0

  actions_cache_url_override: ""

container:
  network: ""
  enable_ipv6: false
  privileged: false
  options: --add-host=dind.internal:host-gateway
  workdir_parent:
  valid_volumes: []
  docker_host: tcp://forgejo_runner_dind:2375
  force_pull: false
  force_rebuild: false

host:
  workdir_parent:

server:
  connections:
    mastercompose:
      url: https://10.147.18.1/forgejo/
      uuid:
      token:
