services:

  # =============================================
  # Ollama
  # =============================================

  ollama:
    image: ollama/ollama:latest
    container_name: mastercompose-ollama
    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:11434

    volumes:
      - ./ai/ollama:/root/.ollama

    networks:
      internal:
        ipv4_address: ${OLLAMA_IP}


  # =============================================
  # AI Gateway
  # =============================================

  ai-gateway:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: mastercompose-ai-gateway
    restart: unless-stopped

    env_file:
      - ../.env

    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "${AI_GATEWAY_PORT}"

    secrets:
      - ai_gateway_key

    volumes:
      - ./ai/gateway/config.yaml:/app/config.yaml:ro

    depends_on:
      - ollama

    networks:
      internal:
        ipv4_address: ${AI_IP}


  # =============================================
  # Open WebUI
  # =============================================

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mastercompose-open-webui
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      WEBUI_URL: ${AI_WEBUI_URL}
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://${AI_IP}:${AI_GATEWAY_PORT}/v1

      RAG_EMBEDDING_MODEL: ""
      RAG_EMBEDDING_ENGINE: "ollama"

    secrets:
      - ai_gateway_key

    volumes:
      - ./ai/open-webui:/app/backend/data

    depends_on:
      - ai-gateway

    networks:
      internal:
        ipv4_address: ${AI_WEBUI_IP}


# =============================================
# Networks
# =============================================

networks:

  internal:
    external: true
    name: mastercompose_internal


# =============================================
# Secrets
# =============================================

secrets:

  ai_gateway_key:
    file: ./../secrets/ai_gateway_key.txt