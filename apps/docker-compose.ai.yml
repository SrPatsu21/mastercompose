services:

  # =============================================
  # Ollama
  # =============================================

  ollama:
    image: ollama/ollama:latest
    container_name: mastercompose-ollama
    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "40960"
      OLLAMA_KEEP_ALIVE: "15m"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    mem_limit: 8g
    memswap_limit: 8g

    volumes:
      - ./ai/ollama:/root/.ollama

    networks:
      internal:
        ipv4_address: ${OLLAMA_IP}


  # =============================================
  # AI Gateway
  # =============================================

  ai-gateway:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: mastercompose-ai-gateway
    restart: unless-stopped

    env_file:
      - ../.env

    entrypoint:
      - "/bin/sh"
      - "/app/entrypoint.sh"

    secrets:
      - ai_gateway_key

    volumes:
      - ./ai/gateway/config.yaml:/app/config.yaml:ro
      - ./ai/gateway/entrypoint.sh:/app/entrypoint.sh:ro
      - ./ai/gateway/loader:/app/loader:ro
      - ./ai/gateway/models:/app/models:ro

    depends_on:
      - ollama

    networks:
      internal:
        ipv4_address: ${AI_IP}


  # =============================================
  # Open WebUI
  # =============================================

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mastercompose-open-webui
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      WEBUI_URL: ${AI_WEBUI_URL}
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://${AI_IP}:${AI_GATEWAY_PORT}/v1
      OPENAI_API_KEY: /run/secrets/ai_gateway_key
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://${SEARXNG_IP}:8080/search"
      WEB_SEARCH_RESULT_COUNT: "5"

      RAG_EMBEDDING_MODEL: ""
      RAG_EMBEDDING_ENGINE: "ollama"

    secrets:
      - ai_gateway_key

    volumes:
      - ./ai/open-webui:/app/backend/data

    depends_on:
      - ai-gateway

    networks:
      internal:
        ipv4_address: ${AI_WEBUI_IP}

  # =============================================
  # SearXNG - Web Search
  # =============================================

  searxng:
    image: searxng/searxng:latest
    container_name: mastercompose-searxng
    restart: unless-stopped

    environment:
      SEARXNG_VALKEY_URL: valkey://172.20.0.24:6379/0

    volumes:
      - ./ai/searxng/config:/etc/searxng:rw
      - ./ai/searxng/cache:/var/cache/searxng:rw

    depends_on:
      - searxng-valkey

    networks:
      internal:
        ipv4_address: ${SEARXNG_IP}


  # =============================================
  # SearXNG - Valkey
  # =============================================

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: mastercompose-searxng-valkey
    restart: unless-stopped

    command:
      - valkey-server
      - --save
      - "300"
      - "1"
      - --loglevel
      - warning

    volumes:
      - ./ai/searxng/valkey:/data

    networks:
      internal:
        ipv4_address: ${SEARXNG_VALKEY_IP}

# =============================================
# Networks
# =============================================

networks:

  internal:
    external: true
    name: mastercompose_internal


# =============================================
# Secrets
# =============================================

secrets:

  ai_gateway_key:
    file: ./../secrets/ai_gateway_key.txt